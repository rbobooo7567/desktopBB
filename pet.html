<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
      }
      #pet {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: fill;
        pointer-events: none;
        transform-origin: 50% 70%;
        user-select: none;
      }
      #holder {
        display: none;
        position: absolute;
        left: 50%;
        top: 36%;
        width: 36%;
        transform: translate(-50%, -100%);
        transform-origin: 50% 100%;
        pointer-events: none;
        z-index: 2;
      }
      body.dragging #holder {
        display: block;
      }
      #hearts {
        position: absolute;
        left: 0;
        right: 0;
        top: 18%;
        height: 40%;
        pointer-events: none;
      }
      .heart {
        position: absolute;
        left: 50%;
        bottom: 0;
        color: #ff6b96;
        font-size: 18px;
        animation: float 0.9s ease-out forwards;
      }
      @keyframes float {
        to {
          transform: translateY(-46px);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <svg id="holder" viewBox="0 0 80 110" aria-hidden="true">
      <path d="M30 0h20c2 16 3 28 2 40H28C27 28 28 16 30 0z" fill="#ffd8c4" stroke="#e4b59c" stroke-width="2" />
      <path d="M18 36c6 8 16 12 22 12s16-4 22-12c4 14 2 28-8 36-12 10-28 8-36-2-8-10-8-24 0-34z" fill="#ffe7d6" stroke="#e4b59c" stroke-width="2" />
      <path d="M16 58c-8 6-10 18-4 24 7 7 16 2 16-8l2-12c0-4-8-6-14-4z" fill="#ffe7d6" stroke="#e4b59c" stroke-width="2" stroke-linejoin="round" />
      <path d="M48 64c6 2 14 10 12 18-3 8-14 8-16 1l-6-14c-1-4 4-7 10-5z" fill="#ffe7d6" stroke="#e4b59c" stroke-width="2" stroke-linejoin="round" />
    </svg>
    <img id="pet" alt="" draggable="false" />
    <div id="hearts"></div>
    <script type="module" src="./pet.js"></script>
  </body>
</html>
